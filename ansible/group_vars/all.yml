---
# Secrets come from the environment; nothing sensitive is committed.
#   export K3S_DATASTORE_ENDPOINT='postgres://user:pass@host:5432/db?sslmode=require'
#   export K3S_TOKEN='...'
k3s_datastore_endpoint: "{{ lookup('env', 'K3S_DATASTORE_ENDPOINT') }}"
k3s_token: "{{ lookup('env', 'K3S_TOKEN') }}"

# Must be identical on every server.
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"
k3s_version: "v1.36.3+k3s1"
k3s_flannel_iface: "tailscale0"

# Derived from inventory so adding a node does not mean editing this too.
k3s_tls_sans: >-
  {{ groups['k3s_servers']
     + (groups['k3s_servers'] | map('extract', hostvars, 'node_ip') | list)
     + ['127.0.0.1'] }}

node_user: ash
node_user_shell: /bin/bash

# Roles that need a reboot fail instead, unless this is set.
allow_reboot: false

tailscale_operator_enabled: false
tailscale_operator_chart_version: "1.98.9"
tailscale_operator_namespace: tailscale
tailscale_oauth_client_id: "{{ lookup('env', 'TS_OAUTH_CLIENT_ID') }}"
tailscale_oauth_client_secret: "{{ lookup('env', 'TS_OAUTH_CLIENT_SECRET') }}"

---
- name: Determine the admin group for this OS family
  ansible.builtin.set_fact:
    common_admin_group: "{{ 'wheel' if ansible_os_family == 'RedHat' else 'sudo' }}"

- name: Create operator user
  ansible.builtin.user:
    name: "{{ node_user }}"
    shell: "{{ node_user_shell }}"
    groups: "{{ common_admin_group }}"
    append: true
    create_home: true
    state: present

- name: Passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/91-{{ node_user }}"
    content: "{{ node_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Ensure .ssh exists
  ansible.builtin.file:
    path: "/home/{{ node_user }}/.ssh"
    state: directory
    owner: "{{ node_user }}"
    group: "{{ node_user }}"
    mode: "0700"

# ansible_env.HOME is root's under become, not the connecting account's.
- name: Look up the connecting account's home
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"
  when: ansible_user != node_user

- name: Copy authorized_keys from the connecting account
  ansible.builtin.copy:
    src: "{{ ansible_facts.getent_passwd[ansible_user][4] }}/.ssh/authorized_keys"
    dest: "/home/{{ node_user }}/.ssh/authorized_keys"
    remote_src: true
    owner: "{{ node_user }}"
    group: "{{ node_user }}"
    mode: "0600"
    force: false
  when: ansible_user != node_user

- name: Restore SELinux labels on the home directory
  ansible.builtin.command: "restorecon -R /home/{{ node_user }}"
  when: ansible_selinux.status is defined and ansible_selinux.status == 'enabled'
  changed_when: false

# Desktop images idle-suspend: Ubuntu's GDM greeter sleeps after 15 min, which drops the node.
- name: Never suspend
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target

# Tailscale's 100.100.100.100 forwards to these, so they become the node's upstream DNS.
- name: Find the default-route NetworkManager connection
  ansible.builtin.shell: |
    set -o pipefail
    dev=$(ip -4 route show default | awk '{print $5; exit}')
    echo "$dev"
    nmcli -g GENERAL.CONNECTION device show "$dev"
  args:
    executable: /bin/bash
  register: common_nm_default
  changed_when: false
  check_mode: false
  when: node_dns_servers is defined

- name: Read the connection's DNS settings
  ansible.builtin.command:
    argv: [nmcli, -g, "ipv4.ignore-auto-dns,ipv4.dns,ipv6.ignore-auto-dns", connection, show, "{{ common_nm_default.stdout_lines[1] }}"]
  register: common_nm_dns
  changed_when: false
  check_mode: false
  when: node_dns_servers is defined

- name: Pin DNS to public resolvers
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ common_nm_default.stdout_lines[1] }}"
      - ipv4.ignore-auto-dns
      - "yes"
      - ipv4.dns
      - "{{ node_dns_servers | join(',') }}"
      - ipv6.ignore-auto-dns
      - "yes"
  when:
    - node_dns_servers is defined
    - common_nm_dns.stdout_lines != ['yes', node_dns_servers | join(','), 'yes']
  changed_when: true
  notify: Reapply the network connection

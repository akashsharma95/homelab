---
- name: Preflight
  hosts: k3s_servers
  gather_facts: false
  run_once: true
  tasks:
    - name: Token must be set
      ansible.builtin.assert:
        that: k3s_token | length > 0
        fail_msg: "Export K3S_TOKEN. See group_vars/all.yml."

    - name: Every server must define node_ip
      ansible.builtin.assert:
        that: hostvars[item].node_ip is defined
        fail_msg: "{{ item }} has no node_ip; TLS SANs and node addressing derive from it."
      loop: "{{ groups['k3s_servers'] }}"

- name: Base node configuration
  hosts: k3s_servers
  become: true
  roles:
    - role: common
      tags: [common]

- name: Hardware and OS prerequisites
  hosts: k3s_servers
  become: true
  roles:
    - role: prereqs_rpi
      when: "'rpi' in group_names"
      tags: [prereqs]
    - role: prereqs_almalinux
      when: "'almalinux' in group_names"
      tags: [prereqs]
    - role: prereqs_debian
      when: "'debian_family' in group_names"
      tags: [prereqs]
    - role: xt_statistic
      when: "'radxa_a733' in group_names"
      tags: [prereqs, xt_statistic]

- name: K3s control plane
  hosts: k3s_servers
  become: true
  serial: 1
  roles:
    - role: k3s_server
      tags: [k3s]

- name: Tailscale Kubernetes operator
  hosts: k3s_servers[0]
  become: true
  roles:
    - role: tailscale_operator
      when: tailscale_operator_enabled | bool
      tags: [operator]

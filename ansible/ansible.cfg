[defaults]
inventory = inventory.yml
host_key_checking = True
retry_files_enabled = False
# The community.general 'yaml' callback was removed in v12; this is its replacement.
result_format = yaml
# Roles need: ansible-galaxy collection install ansible.posix community.general
interpreter_python = auto_silent
# Facts are reused across roles (ansible_kernel drives the module build path).
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible/facts
fact_caching_timeout = 3600

[ssh_connection]
pipelining = True
# Reuse connections; the home<->cloud legs are ~21ms.
ssh_args = -o ControlMaster=auto -o ControlPersist=300s

# Groups select which prerequisite role a host gets; hardware, not OS alone.
# Adding a node: put it in k3s_servers or k3s_agents plus its hardware group, set node_ip, then
#   ansible-playbook -i inventory.yml site.yml --limit <newnode>
all:
  vars:
    ansible_user: ash
    ansible_python_interpreter: auto_silent

  children:
    k3s_servers:
      # The first host initialises etcd; the rest join it. serial: 1 runs in this order.
      # ashx2 first: see docs/decisions.md #4.
      hosts:
        ashx2:
          node_ip: 100.108.19.113
          # Oracle image hostname is "default".
          k3s_node_name: ashx2
        ashx1:
          node_ip: 100.86.153.102
        ashx3:
          node_ip: 100.97.6.117
        ashx4:
          node_ip: 100.76.119.113
        ashx5:
          node_ip: 100.127.154.50

    # Workers only: no etcd member, so they do not change quorum. See docs/decisions.md #3.
    k3s_agents:
      hosts: {}

    rpi:
      hosts:
        ashx3:

    radxa_a733:
      hosts:
        ashx1:

    radxa_q6a:
      hosts:
        ashx4:
        ashx5:

    # Router DHCP hands out AdGuard (ashx4). Nodes must not depend on a workload for DNS.
    home:
      vars:
        node_dns_servers: [1.1.1.1, 9.9.9.9]
      hosts:
        ashx1:
        ashx3:
        ashx4:
        ashx5:

    almalinux:
      hosts:
        ashx2:

    debian_family:
      hosts:
        ashx1:
        ashx3:
        ashx4:
        ashx5:
